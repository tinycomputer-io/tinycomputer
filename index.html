<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tiny Computer</title>
  <meta name="description" content="A small software company in Seattle. Products that make people smile." />
  <meta property="og:title" content="Tiny Computer" />
  <meta property="og:description" content="A small software company in Seattle. Products that make people smile." />
  <meta property="og:url" content="https://tinycomputer.io" />
  <meta property="og:type" content="website" />
  <link rel="canonical" href="https://tinycomputer.io" />
  <style>
    @font-face {
      font-family: "Inter";
      src: url("/fonts/InterVariable.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --paper: #f7f7f4;
      --ink: #21201c;
      --mute: #63635e;
      --hover: #f1f0ef;
      --link-line: #cfceca;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.6;
      font-feature-settings: "cv01", "ss03";
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 72px 30px 96px;
    }

    .mark {
      font-weight: 500;
    }

    .mark span {
      color: var(--mute);
      font-weight: 400;
    }

    .lede {
      margin: 28px 0 0;
      color: var(--mute);
      max-width: 36em;
    }

    h2 {
      margin: 56px 0 12px;
      font-size: 16px;
      font-weight: 500;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    a.row {
      display: block;
      padding: 10px 12px;
      margin: 0 -12px;
      border-radius: 10px;
      text-decoration: none;
      color: inherit;
    }

    a.row:hover { background: var(--hover); }

    .name { font-weight: 400; }

    .desc { color: var(--mute); }

    footer {
      margin-top: 64px;
      color: var(--mute);
    }

    footer a {
      color: var(--ink);
      text-decoration: underline;
      text-decoration-color: var(--link-line);
      text-underline-offset: 2px;
    }

    footer a:hover { text-decoration-color: currentColor; }

    @media (max-width: 640px) {
      .wrap { padding: 56px 20px 80px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="mark">tinycomputer<span>.io</span></div>
    <p class="lede">A small software company in Seattle. Products that make people smile.</p>

    <h2>Products</h2>
    <div class="list">
      <a class="row" href="https://leaguemate.fyi">
        <div class="name">Leaguemate</div>
        <div class="desc">Dynasty analytics for Sleeper leagues.</div>
      </a>
      <a class="row" href="https://flashies.cards">
        <div class="name">Flashies</div>
        <div class="desc">Paste notes, get flashcards.</div>
      </a>
    </div>

    <footer>
      <a href="mailto:hello@tinycomputer.io">hello@tinycomputer.io</a>
      ·
      <a href="https://gauthamv.com">Gautham Vemulapalli</a>
    </footer>
  </main>
</body>
</html>
